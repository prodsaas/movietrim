name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build App
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync build files
        run: |
          rsync -rvz --delete ./build/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/movietrim/build/
          rsync -vz ./package.json ./package-lock.json ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/movietrim/

      - name: Install dependencies & start PM2
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd ~/movietrim

            npm install --omit=dev

            if pm2 describe movietrim > /dev/null 2>&1; then
              pm2 restart movietrim --update-env
            else
              pm2 start build/index.js --name "movietrim" --node-args="--env-file=.env" --update-env
            fi

            pm2 save
          EOF